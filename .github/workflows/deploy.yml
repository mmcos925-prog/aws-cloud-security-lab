name: Deploy to S3

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: arn:aws:iam::404459110644:role/github-actions-s3-role
          aws-region: us-east-1

      - name: Upload to S3
        run: aws s3 cp README.md s3://brandon-first-bucket-2026/README.md
